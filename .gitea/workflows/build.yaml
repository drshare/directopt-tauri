name: Release Desktop Apps
run-name: Release ${{ gitea.ref_name }}

on:
  push:
    tags:
      - "v*"
    branches:
      - main # 推送 main 分支也触发：构建并上传产物（非 tag 不发布 Release）
  workflow_dispatch: # 手动触发：只构建并上传产物，不发布 Release

permissions:
  contents: write

# 同一 tag / 分支排队执行，避免 Release 产物互相覆盖
concurrency:
  group: release-${{ gitea.ref_name }}
  cancel-in-progress: false

env:
  # Gitea 服务地址，checkout / API / Release 上传统一引用它
  GITEA_SERVER: ${{ vars.GITEA_SERVER || secrets.GITEA_SERVER || 'http://10.0.0.5:3001' }}
  # 只代理 GitHub 的 git 请求，两种模式二选一（见各 job 的 "Configure git proxy" 步骤）
  #   1) GH_PROXY_URL 非空：走自建 ghproxy，用 git 的 url.<base>.insteadOf 把
  #      https://github.com/... 改写成 <GH_PROXY_URL>/https://github.com/...
  #      URL 前缀反代，不要求 runner 能出网，也不需要代理支持 CONNECT
  #   2) 否则用 GIT_PROXY：git 对 https://github.com 发 CONNECT，要求该代理支持
  # 不设 HTTP_PROXY / HTTPS_PROXY，避免把内网与国内镜像的流量也送进代理
  GH_PROXY_URL: ${{ vars.CI_GH_PROXY_URL || secrets.CI_GH_PROXY_URL || 'https://gh-proxy.com' }}
  GIT_PROXY: ${{ vars.CI_GIT_PROXY || secrets.CI_GIT_PROXY || 'http://10.0.0.8:7890' }}
  # npm/pnpm 镜像源，须设在 env 才能作用于 pnpm/action-setup 自身安装
  # npm_config_registry: ${{ vars.CI_NPM_REGISTRY || secrets.CI_NPM_REGISTRY || 'https://registry.npmmirror.com' }}
  # NPM_CONFIG_REGISTRY: ${{ vars.CI_NPM_REGISTRY || secrets.CI_NPM_REGISTRY || 'https://registry.npmmirror.com' }}
  NODE_VERSION: "22"
  NDK_VERSION: 27.2.12479018
  TAG_NAME: ${{ gitea.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # 1. 创建草稿 Release（非 tag 触发时内部步骤跳过）
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      # 三个 job 共用同一份步骤定义：这里打锚点，其余两处用 - *setup-git-proxy 引用
      # 写进 runner 的 ~/.gitconfig 并持久化，后续 job / 后续运行下载 action 时也生效
      - &setup-git-proxy
        name: Configure git proxy (GitHub only)
        run: |
          set -euo pipefail

          # 幂等：清掉本 workflow 之前写入的 GitHub git 配置
          git config --global --unset-all "http.https://github.com.proxy" 2>/dev/null || true
          keys="${RUNNER_TEMP:-/tmp}/gh-proxy-keys.txt"
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null | cut -d' ' -f1 > "${keys}" || true
          while read -r k; do
            [ -n "${k}" ] && git config --global --unset-all "${k}" 2>/dev/null || true
          done < "${keys}"

          if [ -n "${GH_PROXY_URL:-}" ]; then
            # 模式一：URL 前缀反代（自建 ghproxy），git 请求被改写成 <GH_PROXY_URL>/https://github.com/...
            git config --global --replace-all "url.${GH_PROXY_URL}/https://github.com/.insteadOf" "https://github.com/"
            echo "::notice::GitHub git -> ${GH_PROXY_URL} (URL 前缀反代)"
            # 探测 git 智能 HTTP：正常应返回 200 + application/x-git-upload-pack-advertisement
            ct=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
              "${GH_PROXY_URL}/https://github.com/actions/checkout/info/refs?service=git-upload-pack" || true)
            echo "info/refs 探测结果: ${ct:-<无响应>}"
            case "${ct}" in
              200*application/x-git-upload-pack-advertisement*) echo "::notice::git 智能 HTTP 代理可用" ;;
              *) echo "::warning::代理未返回 git advertisement，GitHub 上的 action 可能拉不到" ;;
            esac
          elif [ -n "${GIT_PROXY:-}" ]; then
            # 模式二：直连代理，git 对 https://github.com 发 CONNECT
            git config --global --replace-all "http.https://github.com.proxy" "${GIT_PROXY}"
            echo "::notice::GitHub git -> ${GIT_PROXY} (HTTP 代理)"
          else
            echo "::notice::未配置 GitHub git 代理，将直连"
          fi

      - name: Ensure jq
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq jq

      - name: Create draft release
        id: create
        if: startsWith(gitea.ref, 'refs/tags/')
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITEA_SERVER}/api/v1/repos/${GITHUB_REPOSITORY}"
          TAG="${TAG_NAME}"

          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::缺少 secrets.GITEA_TOKEN（需要有仓库写权限的 Gitea 访问令牌）"
            exit 1
          fi

          # curl 统一带重试，避免 runner 侧瞬时网络抖动把整个发布打断
          CURL=(curl -sS --retry 5 --retry-delay 3 --retry-all-errors
                -H "Authorization: token ${GITEA_TOKEN}")

          # 已存在同名 tag 的 Release 则复用（便于重跑失败的流水线）
          RELEASE_ID=$("${CURL[@]}" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')

          if [ -n "${RELEASE_ID}" ]; then
            echo "::notice::复用已存在的 Release #${RELEASE_ID}"
          else
            RELEASE_ID=$("${CURL[@]}" -f -X POST "${API}/releases" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":true,\"prerelease\":false,\"body\":\"自动构建产物：Linux / Windows / macOS / Android / iOS（commit ${GITHUB_SHA}）\"}" \
              | jq -r '.id')
            echo "::notice::已创建草稿 Release #${RELEASE_ID}"
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "upload_url=${API}/releases/${RELEASE_ID}/assets" >> "$GITHUB_OUTPUT"

  # 2. 前端构建校验（环境不支持 artifact，各平台 job 各自构建）
  check-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - *setup-git-proxy

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: ${{ env.GITEA_SERVER }}

      # 装好 pnpm + Node.js，并按 pnpm-lock.yaml 缓存 store
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # 只做校验，产物在 job 内构建后直接丢弃，不上传 artifact
      - name: Build frontend
        run: pnpm build

  # 3. 全平台矩阵构建（platform 字段控制各平台依赖与构建命令）
  build-desktop:
    needs: [create-release, check-frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- 桌面端 ----------------
          - name: linux-x64
            os: ubuntu-latest
            platform: desktop
            rust_targets: x86_64-unknown-linux-gnu
            build_cmd: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

          - name: windows-x64
            os: windows-latest
            platform: desktop
            rust_targets: x86_64-pc-windows-msvc
            build_cmd: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

          - name: macos-universal
            os: macos-latest
            platform: desktop
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_cmd: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz

          # ---------------- 移动端：Android ----------------
          # 一次构建产出全部 ABI 的 APK（--split-per-abi），避免每个 ABI 跑一个 job
          - name: android
            os: ubuntu-latest
            platform: android
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
            build_cmd: pnpm tauri android build --apk --split-per-abi --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
              src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

          # ---------------- 移动端：iOS ----------------
          # 需要 Xcode 16+ 的 macOS runner；无签名证书时仅编译检查
          - name: ios-aarch64
            os: macos-latest
            platform: ios
            rust_targets: aarch64-apple-ios,aarch64-apple-ios-sim
            build_cmd: pnpm tauri ios build --no-sign --target aarch64 --config release-tauri-config.json
            if_no_files: warn
            paths: |
              src-tauri/gen/apple/dist/*.tar.gz

    steps:
      # action 本身是 runner 用 git clone 拉的；这里写进 ~/.gitconfig 并持久化，
      # 保证本 job 后续 step 与之后每次运行取 action 都只代理 github.com
      - *setup-git-proxy

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: ${{ env.GITEA_SERVER }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Setup JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
          save-if: "true"

      # ---------------- 各平台系统依赖 ----------------
      - name: Install Linux dependencies
        if: matrix.platform == 'desktop' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            libssl-dev \
            build-essential \
            curl \
            wget \
            jq

      # MSI 需要 WiX Toolset v3；安装失败时 tauri-bundler 会自行下载，故允许失败
      - name: Install WiX Toolset v3 (for MSI)
        if: matrix.platform == 'desktop' && matrix.os == 'windows-latest'
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: Install NDK
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}"
          # 直接写进 GITHUB_ENV，避免依赖 env 上下文能否读到上一步写入的变量
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Select the newest available Xcode
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$newest" ]; then
            echo "::error::未在该 runner 上找到 Xcode"
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          version="$(xcodebuild -version | head -1 | awk '{print $2}')"
          if [ "${version%%.*}" -lt 16 ]; then
            echo "::error::Xcode $version 过旧，生成的工程需要 Xcode 16+"
            exit 1
          fi
          echo "::notice::Using Xcode $version"
          xcodebuild -version

      # ---------------- 前端构建 ----------------
      - name: Build frontend
        run: pnpm build

      # 前端已构建，禁止 tauri 再跑 beforeBuildCommand；--config 按仓库根解析
      - name: Disable frontend rebuild
        run: |
          cat > release-tauri-config.json <<'EOF'
          {
            "build": {
              "beforeBuildCommand": ""
            }
          }
          EOF

      # ---------------- 生成移动端工程 ----------------
      - name: Init Android project
        if: matrix.platform == 'android'
        run: pnpm tauri android init

      # iOS 缺少 Xcode / macOS runner 时不应让整个流水线失败
      - name: Init iOS project
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: pnpm tauri ios init

      # ---------------- Android 签名配置 ----------------
      # secrets 不能写在 step 级 if 里，先探测再输出
      - name: Check Android signing secrets
        if: matrix.platform == 'android'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置完整的 Android 签名密钥，将产出未签名 APK"
          fi

      # Tauri 生成的 gradle 会从 gen/android/keystore.properties 读取签名信息
      - name: Write keystore.properties
        if: matrix.platform == 'android' && steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gen/android
          base64 -d <<< "${KEYSTORE_BASE64}" > "${RUNNER_TEMP}/keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${RUNNER_TEMP}/keystore.jks
          password=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          EOF

      # ---------------- 构建 ----------------
      - name: Build ${{ matrix.name }}
        if: matrix.platform != 'ios'
        run: ${{ matrix.build_cmd }}

      # iOS 无签名证书时仅做编译检查，失败只告警
      - name: Build ${{ matrix.name }} (compile check, no signing)
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: ${{ matrix.build_cmd }}

      # Google Play 需要 AAB；Rust 产物已缓存，这里主要是 Gradle 重新打包
      - name: Build Android AAB
        if: matrix.platform == 'android' && steps.keystore.outputs.present == 'true'
        run: pnpm tauri android build --aab --config release-tauri-config.json

      # ---------------- 目录型产物打包 ----------------
      # macOS .app 是目录，产物上传不支持目录，打成 tar.gz
      - name: Archive macOS app bundle
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          tar -czf "directopt-desktop_${TAG_NAME}_universal.app.tar.gz" *.app

      # iOS 产物同样是 .app 目录；构建被跳过时这里只告警
      - name: Archive iOS app bundle
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gen/apple/dist
          APP=$(find src-tauri/gen/apple/build -maxdepth 2 -type d -name '*.app' | head -n 1)
          if [ -z "${APP}" ]; then
            echo "::warning::未找到 iOS 构建产物 (.app)，跳过打包"
            exit 0
          fi
          tar -czf "src-tauri/gen/apple/dist/directopt-desktop_${TAG_NAME}_ios_aarch64.app.tar.gz" \
            -C "$(dirname "${APP}")" "$(basename "${APP}")"

      # 产物直传草稿 Release（环境不支持 artifact）
      - name: Upload packages to release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          UPLOAD_URL: ${{ needs.create-release.outputs.upload_url }}
        run: |
          set -euo pipefail
          patterns="${RUNNER_TEMP}/patterns.txt"
          cat > "${patterns}" <<'EOF'
          ${{ matrix.paths }}
          EOF

          files=()
          while IFS= read -r pat; do
            # 不加引号，让通配符展开（matrix.paths 每行一个 glob）
            for f in ${pat}; do
              if [ -f "${f}" ]; then files+=("${f}"); fi
            done
          done < "${patterns}"

          if [ ${#files[@]} -eq 0 ]; then
            if [ "${{ matrix.if_no_files }}" = "error" ]; then
              echo "::error::未找到 ${{ matrix.name }} 的构建产物"
              exit 1
            fi
            echo "::warning::未找到 ${{ matrix.name }} 的构建产物，跳过上传"
            exit 0
          fi

          echo "构建产物："
          printf '  %s\n' "${files[@]}"

          # 手动触发（非 tag）时没有 Release，只打印清单
          if [ -z "${UPLOAD_URL:-}" ] || [ -z "${RELEASE_ID:-}" ]; then
            echo "::notice::非 tag 触发，产物不上传 Release"
            exit 0
          fi
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::缺少 secrets.GITEA_TOKEN（需要有仓库写权限的 Gitea 访问令牌）"
            exit 1
          fi

          CURL=(curl -sS --retry 5 --retry-delay 3 --retry-all-errors
                -H "Authorization: token ${GITEA_TOKEN}")
          API="${GITEA_SERVER}/api/v1/repos/${GITHUB_REPOSITORY}"

          for f in "${files[@]}"; do
            name="$(basename "${f}")"
            # 重跑流水线时先删掉同名旧资产，避免 Release 里出现重复文件
            if command -v jq >/dev/null 2>&1; then
              old_ids=$("${CURL[@]}" "${API}/releases/${RELEASE_ID}/assets" \
                | jq -r --arg n "${name}" '.[] | select(.name == $n) | .id')
              for id in ${old_ids}; do
                echo "删除同名旧资产 ${name} (#${id})"
                "${CURL[@]}" -f -X DELETE "${API}/releases/assets/${id}" > /dev/null
              done
            fi
            echo "上传 ${name}"
            "${CURL[@]}" -f -X POST "${UPLOAD_URL}" \
              -F "name=${name}" \
              -F "attachment=@${f}" > /dev/null
          done

  # 4. 汇总产物 -> 上传草稿 Release -> 幂等发布
  publish-release:
    needs: [create-release, build-desktop]
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - name: Ensure jq
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq jq

      # 各平台 job 已把产物直接上传到 Release，这里下载回来只为生成校验和
      - name: Download release assets
        run: |
          set -euo pipefail
          API="${GITEA_SERVER}/api/v1/repos/${GITHUB_REPOSITORY}"
          CURL=(curl -sS --retry 5 --retry-delay 3 --retry-all-errors
                -H "Authorization: token ${GITEA_TOKEN}")

          rm -rf assets && mkdir -p assets
          "${CURL[@]}" -f "${API}/releases/${RELEASE_ID}/assets" > assets.json

          jq -r '.[] | select(.name != "checksums.txt") | "\(.browser_download_url)\t\(.name)"' assets.json \
          | while IFS=$'\t' read -r url name; do
              echo "下载 ${name}"
              "${CURL[@]}" -fL -o "assets/${name}" "${url}"
            done

          if [ -z "$(ls -A assets)" ]; then
            echo "::error::Release 中没有任何待校验的产物"
            exit 1
          fi
          ls -lh assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs -r sha256sum > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        env:
          UPLOAD_URL: ${{ needs.create-release.outputs.upload_url }}
        run: |
          set -euo pipefail
          API="${GITEA_SERVER}/api/v1/repos/${GITHUB_REPOSITORY}"
          CURL=(curl -sS --retry 5 --retry-delay 3 --retry-all-errors
                -H "Authorization: token ${GITEA_TOKEN}")

          old_ids=$("${CURL[@]}" "${API}/releases/${RELEASE_ID}/assets" \
            | jq -r '.[] | select(.name == "checksums.txt") | .id')
          for id in ${old_ids}; do
            echo "删除旧的 checksums.txt (#${id})"
            "${CURL[@]}" -f -X DELETE "${API}/releases/assets/${id}" > /dev/null
          done

          echo "上传 checksums.txt"
          "${CURL[@]}" -f -X POST "${UPLOAD_URL}" \
            -F "name=checksums.txt" \
            -F "attachment=@assets/checksums.txt" > /dev/null

      # 先按 tag 查询再 PATCH，重复运行时幂等
      - name: Publish release
        run: |
          set -euo pipefail
          API="${GITEA_SERVER}/api/v1/repos/${GITHUB_REPOSITORY}"
          TAG="${TAG_NAME}"
          CURL=(curl -sS --retry 5 --retry-delay 3 --retry-all-errors
                -H "Authorization: token ${GITEA_TOKEN}")

          ID="${RELEASE_ID}"
          if [ -z "${ID}" ]; then
            ID=$("${CURL[@]}" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          fi
          if [ -z "${ID}" ]; then
            echo "::error::未找到 tag ${TAG} 对应的 Release"
            exit 1
          fi

          DRAFT=$("${CURL[@]}" "${API}/releases/${ID}" | jq -r '.draft')
          if [ "${DRAFT}" != "true" ]; then
            echo "::notice::Release ${TAG} 已发布，跳过"
            exit 0
          fi

          "${CURL[@]}" -f -X PATCH "${API}/releases/${ID}" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' > /dev/null
          echo "::notice::Release ${TAG} 已发布：${GITEA_SERVER}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
