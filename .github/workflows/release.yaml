name: Release Desktop & Mobile Apps
run-name: Release ${{ github.ref_name }}

# 只打 tag 才构建全平台并发布 Release；手动触发仅构建、上传产物，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag / 分支排队执行，避免 Release 产物互相覆盖
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'
  NDK_VERSION: 27.2.12479018
  TAG_NAME: ${{ github.ref_name }}
  CARGO_TERM_COLOR: always
  # 让 pnpm 在 CI 下不触发交互式提示（与 .npmrc 的 confirm-modules-purge=false 双保险）
  CI: 'true'
  # pnpm/action-setup@v6 的依赖状态检查子进程不吃 CI、也不读项目根 .npmrc（cwd 不在项目树内），
  # 必须以 npm_config_* 环境变量形式注入，才能绕过「移除 node_modules 需 TTY 确认」导致 iOS 等 CI 构建失败
  npm_config_confirm_modules_purge: 'false'

jobs:
  # 1. 前端只构建一次，产物共享给全部平台：矩阵里不再重复跑 vite build
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-rust: 'false'

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # 2. 全平台矩阵构建（platform 字段控制各平台依赖与构建命令）
  build:
    needs: [frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- 桌面端 ----------------
          - name: linux-x64
            os: ubuntu-latest
            platform: desktop
            rust_targets: x86_64-unknown-linux-gnu
            build_cmd: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

          - name: windows-x64
            os: windows-latest
            platform: desktop
            rust_targets: x86_64-pc-windows-msvc
            build_cmd: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/*_portable.exe

          - name: macos-universal
            os: macos-latest
            platform: desktop
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_cmd: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz

          # ---------------- 移动端：Android ----------------
          # 一次构建产出全部 ABI 的 APK（--split-per-abi），避免每个 ABI 跑一个 job
          - name: android
            os: ubuntu-latest
            platform: android
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
            build_cmd: pnpm tauri android build --apk --split-per-abi --config release-tauri-config.json
            if_no_files: error
            paths: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
              src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

          # ---------------- 移动端：iOS ----------------
          # 需要 Xcode 16+ 的 macOS runner；无签名证书时仅编译检查，产物缺失只告警
          - name: ios-aarch64
            os: macos-latest
            platform: ios
            rust_targets: aarch64-apple-ios,aarch64-apple-ios-sim
            build_cmd: pnpm tauri ios build --no-sign --target aarch64 --config release-tauri-config.json
            if_no_files: warn
            paths: |
              src-tauri/gen/apple/dist/*.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          rust-targets: ${{ matrix.rust_targets }}
          rust-cache-key: ${{ matrix.name }}

      # Android 项目必须在 setup-java(cache: gradle) 之前初始化，
      # 否则 setup-java 找不到 gradle 文件会直接失败
      - name: Init Android project
        if: matrix.platform == 'android'
        run: pnpm tauri android init

      - name: Setup JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      # ---------------- 各平台系统依赖 ----------------
      - name: Install Linux dependencies
        if: matrix.platform == 'desktop' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            libssl-dev \
            build-essential \
            curl \
            wget \
            jq

      # MSI 需要 WiX Toolset v3；安装失败时 tauri-bundler 会自行下载，故允许失败
      - name: Install WiX Toolset v3 (for MSI)
        if: matrix.platform == 'desktop' && matrix.os == 'windows-latest'
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: Install NDK
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}"
          # 直接写进 GITHUB_ENV，避免依赖 env 上下文能否读到上一步写入的变量
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # iOS 定位为 best-effort（构建步与产物收集都只告警），
      # 因此 Xcode 探测/版本校验一律降级为 warning，不再阻断整条 release 流水线
      - name: Select the newest available Xcode
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$newest" ]; then
            echo "::warning::未在该 runner 上找到 Xcode，跳过 Xcode 选择"
            exit 0
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          # 注意：xcodebuild 在 macOS 上用 NSFileHandle 写 stdout，若用
          # `xcodebuild -version | head -1` 会把管道提前关闭，导致 xcodebuild
          # 写剩余输出时抛 NSFileHandleOperationException(Broken pipe) 直接崩溃（exit 134）。
          # 因此先把完整输出落盘再解析，全程不经过管道。
          # 只重定向 stdout（stderr 仍保留到日志），并按行首 "Xcode " 匹配而非固定取第 1 行，
          # 避免 runner 上 xcodebuild 的告警/许可信息混入后解析到错误的行。
          xcodebuild -version > "$RUNNER_TEMP/xcode_version.txt"
          version="$(awk '/^Xcode /{print $2; exit}' "$RUNNER_TEMP/xcode_version.txt")"
          if [ -z "${version:-}" ]; then
            echo "::warning::无法从 xcodebuild -version 输出中解析 Xcode 版本"
            cat "$RUNNER_TEMP/xcode_version.txt"
          elif [ "${version%%.*}" -lt 16 ]; then
            echo "::warning::Xcode $version 过旧，生成的工程需要 Xcode 16+（构建大概率失败，此处仅告警不阻断）"
          else
            echo "::notice::Using Xcode $version"
          fi
          xcodebuild -version

      # ---------------- 前端构建 ----------------
      # 前端已由 frontend job 构建并上传，这里直接下载复用
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist-download

      # 上传时可能保留 dist/ 前缀，也可能只上传目录内容，这里两种结构都归一到 dist/
      - name: Restore frontend dist
        run: |
          set -euo pipefail
          if [ -d dist-download/dist ]; then
            rm -rf dist
            mv dist-download/dist dist
            rm -rf dist-download
          else
            rm -rf dist
            mv dist-download dist
          fi
          test -f dist/index.html
          ls dist

      # 前端已构建，禁止 tauri 再跑 beforeBuildCommand；--config 按仓库根解析
      - name: Disable frontend rebuild
        run: |
          cat > release-tauri-config.json <<'EOF'
          {
            "build": {
              "beforeBuildCommand": ""
            }
          }
          EOF

      # ---------------- 生成移动端工程 ----------------
      # Android 已在 setup-java 之前初始化（见上）
      # iOS 缺少 Xcode / macOS runner 时不应让整个流水线失败
      - name: Init iOS project
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm tauri ios init
          # 回显生成的工程：init 若未产出 Xcode 工程，后续 build 必然失败，
          # 这里提前暴露，避免把问题推迟到构建阶段才被发现
          ls -d src-tauri/gen/apple/*.xcodeproj src-tauri/gen/apple/*.xcworkspace 2>/dev/null || \
            echo "::warning::tauri ios init 后未找到 Xcode 工程文件"

      # pnpm v11 在 Xcode「Build Rust Code」Run Script 子进程中做依赖状态检查时会因无 TTY 中止；
      # 该子进程既不继承 workflow env（CI / npm_config_*），也不读项目根 .npmrc（cwd 在 src-tauri/gen/apple），
      # 唯一能穿透的方式是把配置写入 runner 全局 .npmrc（全局安装的 pnpm 必定读取）
      - name: Disable pnpm modules purge prompt (global, iOS only)
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          pnpm config set confirm-modules-purge false --global
          # 回读校验：确认配置真的落到 runner 全局 .npmrc，避免静默失效后排障无据
          echo "confirm-modules-purge = $(pnpm config get confirm-modules-purge --global)"
          echo "--- global npmrc (${HOME}/.npmrc) ---"
          cat "${HOME}/.npmrc" 2>/dev/null || echo "(无全局 .npmrc，配置可能未生效)"

      # ---------------- 签名配置 ----------------
      # secrets 不能写在 step 级 if 里，先探测再输出
      - name: Check Android signing secrets
        if: matrix.platform == 'android'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置完整的 Android 签名密钥，将产出未签名 APK"
          fi

      # Tauri 生成的 gradle 会从 gen/android/keystore.properties 读取签名信息
      - name: Write keystore.properties
        if: matrix.platform == 'android' && steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gen/android
          base64 -d <<< "${KEYSTORE_BASE64}" > "${RUNNER_TEMP}/keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${RUNNER_TEMP}/keystore.jks
          password=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          EOF

      # 未配置 Apple 证书时保持原行为：产出 ad-hoc 签名的 macOS 包
      - name: Configure macOS signing
        if: matrix.platform == 'desktop' && matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::notice::未配置完整的 Apple 签名密钥，将产出未签名（ad-hoc）的 macOS 产物"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}"
            [ -n "${APPLE_ID:-}" ] && echo "APPLE_ID=${APPLE_ID}" || true
            [ -n "${APPLE_PASSWORD:-}" ] && echo "APPLE_PASSWORD=${APPLE_PASSWORD}" || true
            [ -n "${APPLE_TEAM_ID:-}" ] && echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" || true
          } >> "$GITHUB_ENV"
          echo "::notice::已启用 macOS 签名与公证"

      # ---------------- 构建 ----------------
      - name: Build ${{ matrix.name }}
        if: matrix.platform != 'ios'
        run: ${{ matrix.build_cmd }}

      # iOS 无签名证书时仅做编译检查，失败只告警
      - name: Build ${{ matrix.name }} (compile check, no signing)
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: ${{ matrix.build_cmd }}

      # Windows 绿色便携版：编译产物本身就是免安装单文件 exe，复制一份带版本号的命名
      - name: Prepare Windows portable exe
        if: matrix.name == 'windows-x64'
        run: |
          set -euo pipefail
          SRC="src-tauri/target/x86_64-pc-windows-msvc/release/directopt-desktop.exe"
          DST="src-tauri/target/x86_64-pc-windows-msvc/release/directopt-desktop_${TAG_NAME}_x64_portable.exe"
          cp -f "${SRC}" "${DST}"
          ls -lh "${DST}"

      # Google Play 需要 AAB；Rust 产物已缓存，这里主要是 Gradle 重新打包
      - name: Build Android AAB
        if: matrix.platform == 'android' && steps.keystore.outputs.present == 'true'
        run: pnpm tauri android build --aab --config release-tauri-config.json

      # ---------------- 目录型产物打包 ----------------
      # macOS .app 是目录，产物上传不支持目录，打成 tar.gz
      - name: Archive macOS app bundle
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          tar -czf "directopt-desktop_${TAG_NAME}_universal.app.tar.gz" *.app

      # iOS 产物同样是 .app 目录；构建被跳过时这里只告警
      - name: Archive iOS app bundle
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gen/apple/dist
          APP=""
          # 产物实际路径随 Xcode 版本变化，常见为
          # build/Build/Products/Release-iphoneos/<App>.app —— 距 build 已有 4 层，
          # 原来的 -maxdepth 2 必然漏掉，导致构建明明成功却归档不到任何产物。
          # 这里放宽深度、排除 Pods，并在找不到 .app 时回退到 .xcarchive。
          if [ -d src-tauri/gen/apple ]; then
            APP=$(find src-tauri/gen/apple -maxdepth 8 -type d -name '*.app' \
              -not -path '*/Pods/*' 2>/dev/null | head -n 1)
            if [ -z "${APP}" ]; then
              APP=$(find src-tauri/gen/apple -maxdepth 8 -type d -name '*.xcarchive' 2>/dev/null | head -n 1)
            fi
          fi
          if [ -z "${APP}" ]; then
            echo "::warning::未找到 iOS 构建产物 (.app/.xcarchive)，跳过打包"
            exit 0
          fi
          echo "::notice::归档 iOS 产物: ${APP}"
          tar -czf "src-tauri/gen/apple/dist/directopt-desktop_${TAG_NAME}_ios_aarch64.app.tar.gz" \
            -C "$(dirname "${APP}")" "$(basename "${APP}")"

      # ---------------- 汇总产物 ----------------
      # 统一加平台前缀后放进 stage/，避免 Release 汇总时同名文件互相覆盖
      - name: Stage ${{ matrix.name }} artifacts
        run: |
          set -euo pipefail
          mkdir -p stage
          patterns="${RUNNER_TEMP}/patterns.txt"
          cat > "${patterns}" <<'EOF'
          ${{ matrix.paths }}
          EOF
          found=0
          while IFS= read -r pat; do
            [ -z "${pat}" ] && continue
            # 用 find 匹配：-path 的 * 可跨目录，规避 shell 通配符对 ** 的支持差异
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              cp -f "${f}" "stage/${{ matrix.name }}-$(basename "${f}")"
              found=$((found + 1))
            done < <(find . -type f -path "./${pat}" -print)
          done < "${patterns}"
          if [ "${found}" -eq 0 ]; then
            if [ "${{ matrix.if_no_files }}" = "error" ]; then
              echo "::error::未找到 ${{ matrix.name }} 的构建产物"
              exit 1
            fi
            echo "::warning::未找到 ${{ matrix.name }} 的构建产物，跳过上传"
          fi
          ls -lh stage || true

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: stage/*
          retention-days: 7
          if-no-files-found: warn

  # 3. 汇总产物 -> 生成校验和 -> 发布 Release（仅 tag 触发）
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          # 清理 frontend-dist artifact 混入的前端静态文件，只保留安装包
          rm -f index.html tauri.svg vite.svg
          rm -rf assets templates
          if [ -z "$(ls -A .)" ]; then
            echo "::error::没有可发布的构建产物"
            exit 1
          fi
          ls -lh
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      # 幂等发布：Release 不存在则创建（自动生成 release notes），已存在则覆盖上传产物
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # 形如 v1.2.3-beta.1 的标签标记为预发布
          args=()
          case "${TAG}" in
            *-*) args+=(--prerelease) ;;
          esac
          # release job 未 checkout 源码（无 .git），gh 命令须显式指定 --repo
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} 已存在，覆盖上传产物"
            gh release upload "${TAG}" artifacts/* --clobber --repo "${REPO}"
          else
            echo "::notice::创建 Release ${TAG}"
            gh release create "${TAG}" artifacts/* --title "${TAG}" --generate-notes --repo "${REPO}" ${args[@]+"${args[@]}"}
          fi
